name: Release on push

on:
  push:
    branches:
      - main
    paths:
      - "it/**"
      - "update/it/**"
      - "exefs/**"
      - "README.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necessario per creare tag e release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # serve per avere i tag

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate next tag
        id: tagger
        run: |
          # Trova l'ultimo tag 1.1.X, altrimenti parte da 1.1.0
          last_tag=$(git tag --list "1.1.*" | sort -V | tail -n 1)
          if [ -z "$last_tag" ]; then
            next_tag="1.1.0"
          else
            base=${last_tag%.*}
            num=${last_tag##*.}
            next_tag="$base.$((num+1))"
          fi
          echo "next_tag=$next_tag" >> $GITHUB_OUTPUT

      - name: Create release folders
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dqmj3p-it-release"
          package="$stage/DQMJ3P_IT_${{ steps.tagger.outputs.next_tag }}"
          archive="$stage/DQMJ3P_IT_${{ steps.tagger.outputs.next_tag }}.zip"
          rm -rf "$stage"
          mkdir -p "$package/main_it/data" "$package/update_it/data" "$package/exefs"

          # Copia solo i file della patch: nessun CIA o contenuto del gioco viene distribuito.
          cp -R it/. "$package/main_it/data/"
          cp -R update/it/. "$package/update_it/data/"
          # Il font esteso è usato anche dal RomFS dell'update quando si ricostruisce il CIA.
          mkdir -p "$package/update_it/data/Font"
          cp it/Font/break_font_L.bffnt "$package/update_it/data/Font/"
          cp exefs/code.ips "$package/exefs/code.ips"
          cp README.md "$package/"

          test -s "$package/exefs/code.ips"
          test -s "$package/main_it/data/Font/break_font_L.bffnt"
          test -s "$package/update_it/data/Font/break_font_L.bffnt"
          test -d "$package/main_it/data/Message"
          test -d "$package/update_it/data/Message"

          (cd "$stage" && zip -q -r "$archive" "DQMJ3P_IT_${{ steps.tagger.outputs.next_tag }}")
          sha256sum "$archive" | awk '{print $1"  "$2}' > "$archive.sha256"

      - name: Create tag
        run: |
          git tag ${{ steps.tagger.outputs.next_tag }}
          git push origin ${{ steps.tagger.outputs.next_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.next_tag }}
          name: Release ${{ steps.tagger.outputs.next_tag }}
          files: |
            ${{ runner.temp }}/dqmj3p-it-release/DQMJ3P_IT_${{ steps.tagger.outputs.next_tag }}.zip
            ${{ runner.temp }}/dqmj3p-it-release/DQMJ3P_IT_${{ steps.tagger.outputs.next_tag }}.zip.sha256
